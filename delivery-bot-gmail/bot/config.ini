[mail]
; ส่งอีเมลแจ้งงานหายผ่าน Gmail (Macro เขียนไฟล์ไว้ที่ mail_outbox แล้วบอตส่ง ไม่ต้องมี Outlook)
; ที่อยู่อีเมลและ App Password เก็บใน Windows Credential Manager ด้วย  python calplan_bot.py --setup-mail  (ไม่เขียนในไฟล์นี้)
; ผู้รับ To / CC ตั้งที่ชีต Config ในไฟล์ Excel : mail_to / mail_cc
