; ตั้งค่าบอตส่งแผนอัตโนมัติ Calendar Plan -> Delivery Tracking  (ไฟล์นี้ไม่มีรหัสผ่านใดๆ)

[excel]
; path เต็มของไฟล์ Delivery Tracking.xlsm (ไฟล์ export-tasks ที่โหลด และ Log จะเก็บในโฟลเดอร์เดียวกับไฟล์นี้)
workbook = C:\DeliveryGPS\plan-bot\Delivery Tracking.xlsm
macro = DP_AutoRun
; ช่วงวันที่งาน (ตายตัว) : B1 = วันนี้ , C1 = วันถัดไป (รันวันศุกร์ = ถึงวันจันทร์) ใส่ Plan!B1-C1 และตั้งบนเว็บให้เอง ; เพิ่ม/แก้งานตามช่วงนี้
; เวลารัน Task Scheduler (จันทร์-เสาร์) ; เปลี่ยนเวลาแล้วรัน python calplan_bot.py --install-task ใหม่
; รันทุกวัน ช่วงเวลา run_from ถึง run_to ทุก every_min นาที (รอบหลังจะตรวจงานเดิมที่ User เพิ่งกรอกข้อมูลเพิ่ม/แก้ไข แล้วส่งอัปเดตให้ จับคู่ด้วย Client Name
; และเตือนงานที่เคยส่งขึ้นระบบแต่ไม่มีใน Calendar Plan แล้ว : Notepad + อีเมล ตั้งผู้รับที่ชีต Config ในไฟล์ Excel : mail_to / mail_cc)
run_from = 06:00
run_to = 20:00
every_min = 60
; เครื่องปิด/หลับตอน run_time แล้วเปิดทีหลัง : รันย้อนหลังได้ถึงเวลานี้ของวันเดียวกัน (เลยแล้วข้ามรอบนั้น)
latest_time = 23:30
; บันทึกไฟล์ Excel หลังรัน Macro (true = บันทึกทับไฟล์เดิม)
save_workbook = true
; เก็บไฟล์ export-tasks_*.xlsx ที่บอตโหลดไว้กี่วัน
keep_days = 30
; รอบหนึ่งนานเกินกี่นาทีให้จบเอง
watchdog_min = 35

[calendar]
url = https://calendar-plan.scmref-thai.com
; เว้นว่าง = ใช้ชื่อผู้ใช้ที่ตั้งด้วย --setup-calplan
username =
; false = เปิดหน้าต่างเบราว์เซอร์ให้เห็นระหว่างทำงาน (แนะนำ : เว็บใช้ reCAPTCHA แบบมองไม่เห็น)
headless = false
; chrome / msedge = ใช้เบราว์เซอร์ที่ติดตั้งในเครื่อง ; เว้นว่าง = Chromium ของ Playwright
channel = msedge
timeout_sec = 90

